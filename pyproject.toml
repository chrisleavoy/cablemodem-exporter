[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cablemodem-exporter"
version = "0.4.1"
description = "Prometheus exporter and reboot tool for Compal/CBN DOCSIS cable modems (CD8000)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Leavoy" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "requests>=2.25,<3",
    "prometheus-client>=0.20,<1",
]

[project.urls]
Homepage = "https://github.com/chrisleavoy/cablemodem-exporter"
Issues = "https://github.com/chrisleavoy/cablemodem-exporter/issues"

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
cablemodem-exporter = "cablemodem_exporter:main"
cablemodem-reboot = "cablemodem_reboot:main"

[tool.setuptools]
py-modules = ["cablemodem_client", "cablemodem_exporter", "cablemodem_reboot"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
